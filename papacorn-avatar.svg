  .st { fill: #333; font-family: sans-serif; }
  .tag { fill: #555; font-family: sans-serif; font-size: 15px; }
  .name-big { fill: #C62828; font-family: sans-serif; font-size: 36px; font-weight: 800; letter-spacing: 2px; }
